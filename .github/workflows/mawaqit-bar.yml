name: Kimono Prayer (mawaqit-bar)

# Every push and PR: apply the patches, run the checks, build both apps.
# A tag mawaqit-bar/v<upstream>-kimono.<n> (e.g. mawaqit-bar/v1.2.2-kimono.1)
# releases: the Mac app (DMG and zip) and the GNOME extension zip, on a GitHub
# release.
#
# The Mac app is signed and notarized only when the Developer ID secrets are set
# (the same names upstream's release workflow uses: MACOS_CERTIFICATE_P12,
# MACOS_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD).
# Without them it's ad-hoc signed, and Gatekeeper asks on first open.
on:
  push:
    branches: [main]
    tags: ["mawaqit-bar/v*"]
    paths: ["apps/mawaqit-bar/**", "upstream/mawaqit-bar", "scripts/**", ".github/workflows/mawaqit-bar.yml"]
  pull_request:
    paths: ["apps/mawaqit-bar/**", "upstream/mawaqit-bar", "scripts/**", ".github/workflows/mawaqit-bar.yml"]
  workflow_dispatch:

concurrency:
  group: mawaqit-bar-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gnome:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: Apply patches
        run: |
          scripts/check-pin.sh mawaqit-bar
          scripts/apply.sh mawaqit-bar
          scripts/versions.sh mawaqit-bar | tee -a "$GITHUB_ENV"
      # Upstream's own GNOME tests run under gjs, as upstream's CI does.
      - name: Install GJS
        run: sudo apt-get update && sudo apt-get install -y gjs
      - name: Check the extension, and zip it
        run: apps/mawaqit-bar/checks/gnome.sh work/mawaqit-bar --zip
      - uses: actions/upload-artifact@v4
        with:
          name: kimono-prayer-gnome-${{ env.VERSION }}
          path: work/mawaqit-bar-dist/prayer@kimono.app.shell-extension.zip
          retention-days: 14

  macos:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: Apply patches
        run: |
          scripts/check-pin.sh mawaqit-bar
          scripts/apply.sh mawaqit-bar
          scripts/versions.sh mawaqit-bar | tee -a "$GITHUB_ENV"
      # dmgbuild draws the DMG window (background, icon positions) as upstream's release does.
      - name: Install dmgbuild
        run: pipx install dmgbuild || python3 -m pip install --user dmgbuild
      - name: Import the Developer ID certificate, if there is one
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_P12" ] || [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "No signing certificate here: the app will be ad-hoc signed."; exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Check the app, and build it
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: apps/mawaqit-bar/checks/macos.sh work/mawaqit-bar --app
      - uses: actions/upload-artifact@v4
        with:
          name: kimono-prayer-macos-${{ env.VERSION }}
          path: |
            work/mawaqit-bar-dist/*.dmg
            work/mawaqit-bar-dist/*-macos.zip
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/mawaqit-bar/v')
    needs: [gnome, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          git submodule update --init --depth 1 upstream/mawaqit-bar
          scripts/versions.sh mawaqit-bar | tee -a "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish the GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Kimono Prayer $VERSION" \
              --notes "Mawaqit Bar $UPSTREAM_TAG with Kimono's patches: the Mac menu bar app and the GNOME extension, reading prayer times from Kimono Prayer."
          gh release upload "$GITHUB_REF_NAME" --clobber dist/*

  # The patched tree as a branch, for reading and diffing on GitHub: two
  # commits (upstream, then upstream + Kimono) with no history behind them.
  # Generated: never edit it, edit the patches.
  publish-branch:
    if: github.ref == 'refs/heads/main' && !failure() && !cancelled()
    needs: [gnome, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: Push patched/mawaqit-bar
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          scripts/apply.sh mawaqit-bar
          . apps/mawaqit-bar/upstream.env
          cd work/mawaqit-bar
          export GIT_AUTHOR_NAME=repatches GIT_AUTHOR_EMAIL=repatches@kimono.invalid GIT_COMMITTER_NAME=repatches GIT_COMMITTER_EMAIL=repatches@kimono.invalid
          PIN=$(git -C "$GITHUB_WORKSPACE" ls-files -s upstream/mawaqit-bar | awk '{print $2}')
          # Upstream's .github/ is left out: GitHub won't let this token push workflow
          # files, and they must not run here anyway.
          without_github() {
            GIT_INDEX_FILE="$RUNNER_TEMP/patched-index" git read-tree "$1"
            GIT_INDEX_FILE="$RUNNER_TEMP/patched-index" git rm -r -q --cached --ignore-unmatch .github
            GIT_INDEX_FILE="$RUNNER_TEMP/patched-index" git write-tree
          }
          base=$(git commit-tree "$(without_github "$PIN^{tree}")" -m "Mawaqit Bar $UPSTREAM_TAG ($PIN), unmodified (without .github/)")
          top=$(git commit-tree "$(without_github "HEAD^{tree}")" -p "$base" -m "Kimono Prayer: patches and branding from $GITHUB_REPOSITORY@$GITHUB_SHA")
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$top:refs/heads/patched/mawaqit-bar"
